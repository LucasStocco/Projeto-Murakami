<ui:composition
  template="/WEB-INF/template/LayoutPadrao.xhtml"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:p="http://primefaces.org/ui">
  
  <ui:define name="titulo">Cadastro de Cursos</ui:define>
  
  <ui:define name="corpo">
  
    <h:form id="formulario">

        <h1>Cadastro de Cursos</h1>

        <p:growl id="growl" showDetail="false" />

        <p:toolbar style="margin-top: 20px">
            <p:toolbarGroup>
                <p:commandButton icon="pi pi-plus" value="Novo Curso" id="botaoNovo" 
                    oncomplete="PF('editarDialogWidgetVar').show()"
                    update="editarDialog"    
                    actionListener="#{manterCursoBean.limpar}"                    
                    process="@this"/>
            </p:toolbarGroup>
        </p:toolbar>
        
        <p:dataTable id="cursosTable" var="curso" value="#{manterCursoBean.cursos}"
            lazy="false" showGridlines="true"
            style="margin-top: 20px" emptyMessage="Nenhum curso encontrado." rows="10"
            paginator="true" paginatorAlwaysVisible="true" paginatorPosition="bottom"
            rowsPerPageTemplate="5,10,15">        

            <p:column headerText="Id">
                <h:outputText value="#{curso.id}" />
            </p:column>    

            <p:column headerText="Nome"
                filterBy="#{curso.nome}" sortBy="#{curso.nome}">
                <h:outputText value="#{curso.nome}" />
            </p:column>    

            <p:column headerText="Descrição">
                <h:outputText value="#{curso.descricao}" />
            </p:column>

            <p:column headerText="Operações">                    
                
                <p:commandButton id="cb1" icon="pi pi-pencil" title="Editar"                        
                    oncomplete="PF('editarDialogWidgetVar').show()"
                    update=":formulario:editarDialog"                        
                    process="@this">
                    <f:setPropertyActionListener target="#{manterCursoBean.curso}" 
                        value="#{curso}" />
                </p:commandButton>

                <p:commandButton icon="pi pi-trash" title="Excluir"
                    onclick="PF('confirmacaoExclusao').show();"
                    process="@this">
                    <f:setPropertyActionListener target="#{manterCursoBean.curso}"
                        value="#{curso}" />
                </p:commandButton>
            </p:column>

        </p:dataTable>

        <p:dialog id="editarDialog" header="Curso" widgetVar="editarDialogWidgetVar"
            modal="true" resizable="true" closeOnEscape="true"
            showEffect="explode" hideEffect="explode" 
            width="50%" position="center top" maximizable="true"
            height="50%" fitViewport="true" responsive="true">

            <p:panelGrid id="grid" columns="2">

                <p:outputLabel for="id" value="Id: " />
                <p:outputLabel id="id" value="#{manterCursoBean.curso.id}" />

                <p:outputLabel for="nome" value="Nome: " />
                <p:inputText id="nome" value="#{manterCursoBean.curso.nome}" required="true"/>

                <p:outputLabel for="descricao" value="Descrição: " />
                <p:inputTextarea id="descricao" value="#{manterCursoBean.curso.descricao}" 
                    rows="4" cols="30"/>

                <p:commandButton icon="pi pi-save" id="salvarButton"
                    value="Salvar" title="Grava dados do curso"
                    actionListener="#{manterCursoBean.salvar}"
                    oncomplete="if (!args.validationFailed) PF('editarDialogWidgetVar').hide()"
                    update="growl cursosTable" process="@this grid">
                </p:commandButton>                        

            </p:panelGrid>

        </p:dialog>
        
        <p:confirmDialog id="confirmacaoExclusaoDialog"
            widgetVar="confirmacaoExclusao"
            message="Tem certeza que deseja excluir o curso #{manterCursoBean.curso.nome}?"
            header="Exclusão de Curso" severity="alert">
            <p:button icon="pi pi-thumbs-down" value="Não"
                onclick="PF('confirmacaoExclusao').hide(); return false;" 
                process="@this"/>
            <p:commandButton icon="pi pi-thumbs-up" value="Sim" 
                update=":formulario:cursosTable"
                onclick="PF('confirmacaoExclusao').hide();"
                action="#{manterCursoBean.excluir}"
                process="@this"/>
        </p:confirmDialog>    

    </h:form>
  </ui:define>
</ui:composition>
